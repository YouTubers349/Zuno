<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuno — Мессенджер</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
    min-height: 100vh;
}

header {
    padding: 25px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    color: transparent;
}

.profile {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.container {
    padding: 15px 20px;
}

h1 {
    font-size: 27px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

.search {
    width: 100%;
    padding: 16px;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: white;
    outline: none;
    margin-bottom: 25px;
    font-size: 15px;
}

.search:focus {
    border-color: #8b5cf6;
}

.chat {
    display: flex;
    align-items: center;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 22px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    cursor: pointer;
    transition: 0.25s;
    animation: appear 0.6s ease both;
}

.chat:active {
    transform: translateY(-4px) scale(0.98);
    background: rgba(255,255,255,0.09);
}

.avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    margin-right: 15px;
    flex-shrink: 0;
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-info h3 {
    font-size: 16px;
    margin-bottom: 7px;
}

.chat-info p {
    color: #888;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.time {
    color: #777;
    font-size: 11px;
    align-self: flex-start;
}

.bottom {
    position: fixed;
    bottom: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-around;
    padding: 15px 5px;
    border-radius: 25px;
    background: rgba(25,25,25,0.85);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(25px);
}

.nav-button {
    color: #777;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.nav-button span {
    display: block;
    font-size: 21px;
    margin-bottom: 5px;
}

.nav-button.active {
    color: #a78bfa;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Zuno</div>
    <div class="profile">👤</div>
</header>

<div class="container">

    <h1>Сообщения</h1>
    <p class="subtitle">Общайся без границ</p>

    <input
        class="search"
        id="search"
        placeholder="🔍 Поиск чатов..."
        oninput="searchChats()"
    >

    <div id="chats">

        <div class="chat" onclick="openChat('Александр')">
            <div class="avatar">А</div>
            <div class="chat-info">
                <h3>Александр</h3>
                <p>Привет! Как дела?</p>
            </div>
            <div class="time">12:30</div>
        </div>

        <div class="chat" onclick="openChat('Мария')">
            <div class="avatar">М</div>
            <div class="chat-info">
                <h3>Мария</h3>
                <p>Отправила тебе фотографию</p>
            </div>
            <div class="time">11:45</div>
        </div>

        <div class="chat" onclick="openChat('Друзья')">
            <div class="avatar">👥</div>
            <div class="chat-info">
                <h3>Друзья</h3>
                <p>Илья: Го сегодня гулять?</p>
            </div>
            <div class="time">Вчера</div>
        </div>

        <div class="chat" onclick="openChat('Новый чат')">
            <div class="avatar">+</div>
            <div class="chat-info">
                <h3>Новый чат</h3>
                <p>Начни общение</p>
            </div>
        </div>

    </div>
</div>

<div class="bottom">
    <div class="nav-button active" onclick="showSection('Сообщения')">
        <span>💬</span>
        Чаты
    </div>

    <div class="nav-button" onclick="showSection('Контакты')">
        <span>👥</span>
        Контакты
    </div>

    <div class="nav-button" onclick="showSection('Профиль')">
        <span>👤</span>
        Профиль
    </div>
</div>

<script>
function searchChats() {
    const input = document.getElementById("search").value.toLowerCase();
    const chats = document.querySelectorAll(".chat");

    chats.forEach(chat => {
        const name = chat.querySelector("h3").textContent.toLowerCase();
        chat.style.display = name.includes(input) ? "flex" : "none";
    });
}

function openChat(name) {
    alert("Чат с " + name + "\n\nНастоящие сообщения подключим следующим этапом!");
}

function showSection(name) {
    alert("Раздел: " + name + "\n\nЭтот раздел скоро появится!");
}
</script>

</body>
          </html>
