<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Zuno — Мессенджер</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Шапка */

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 25px 20px;
}

.logo {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
}

.profile {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    backdrop-filter: blur(20px);
}

/* Главная */

.container {
    padding: 15px 20px 110px;
}

h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: rgba(255,255,255,0.45);
    font-size: 14px;
    margin-bottom: 28px;
}

/* Поиск */

.search {
    width: 100%;
    padding: 17px;
    margin-bottom: 25px;
    border-radius: 20px;

    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.12);

    color: white;
    font-size: 15px;
    outline: none;

    backdrop-filter: blur(25px);
    transition: 0.3s;
}

.search:focus {
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.35);
}

.search::placeholder {
    color: rgba(255,255,255,0.35);
}

/* Стеклянные чаты */

.chat {
    display: flex;
    align-items: center;

    padding: 17px;
    margin-bottom: 13px;

    border-radius: 24px;

    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.11);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    position: relative;
    overflow: hidden;

    cursor: pointer;

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease;

    animation: appear 0.7s ease both;
}

/* Блик на стекле */

.chat::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 1px;

    background: rgba(255,255,255,0.22);
}

.chat:active {
    transform: translateY(-5px) scale(0.98);
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.25);
}

.avatar {
    width: 54px;
    height: 54px;
    border-radius: 50%;

    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.16);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    font-weight: bold;

    margin-right: 15px;
    flex-shrink: 0;
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-info h3 {
    font-size: 16px;
    margin-bottom: 7px;
    font-weight: 600;
}

.chat-info p {
    font-size: 13px;
    color: rgba(255,255,255,0.45);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.time {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    align-self: flex-start;
}

/* Нижняя панель */

.bottom {
    position: fixed;
    bottom: 15px;
    left: 15px;
    right: 15px;

    display: flex;
    justify-content: space-around;
    align-items: center;

    padding: 17px 5px;

    border-radius: 27px;

    background: rgba(15,15,15,0.72);
    border: 1px solid rgba(255,255,255,0.13);

    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);

    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.nav-button {
    color: rgba(255,255,255,0.4);
    text-align: center;
    font-size: 12px;
    cursor: pointer;

    transition: 0.3s;
}

.nav-button span {
    display: block;
    font-size: 22px;
    margin-bottom: 6px;
    filter: grayscale(1);
}

.nav-button.active {
    color: white;
}

.nav-button.active span {
    filter: grayscale(0);
}

/* Анимации */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chat:nth-child(1) {
    animation-delay: 0.1s;
}

.chat:nth-child(2) {
    animation-delay: 0.2s;
}

.chat:nth-child(3) {
    animation-delay: 0.3s;
}

.chat:nth-child(4) {
    animation-delay: 0.4s;
}

@media (prefers-reduced-motion: reduce) {
    * {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Zuno</div>
    <div class="profile">👤</div>
</header>

<div class="container">

    <h1>Сообщения</h1>
    <p class="subtitle">Общайся без границ</p>

    <input
        class="search"
        id="search"
        placeholder="⌕ Поиск чатов..."
        oninput="searchChats()"
    >

    <div id="chats">

        <div class="chat" onclick="openChat('Александр')">
            <div class="avatar">А</div>
            <div class="chat-info">
                <h3>Александр</h3>
                <p>Привет! Как дела?</p>
            </div>
            <div class="time">12:30</div>
        </div>

        <div class="chat" onclick="openChat('Мария')">
            <div class="avatar">М</div>
            <div class="chat-info">
                <h3>Мария</h3>
                <p>Отправила тебе фотографию</p>
            </div>
            <div class="time">11:45</div>
        </div>

        <div class="chat" onclick="openChat('Друзья')">
            <div class="avatar">👥</div>
            <div class="chat-info">
                <h3>Друзья</h3>
                <p>Илья: Го сегодня гулять?</p>
            </div>
            <div class="time">Вчера</div>
        </div>

        <div class="chat" onclick="openChat('Новый чат')">
            <div class="avatar">+</div>
            <div class="chat-info">
                <h3>Новый чат</h3>
                <p>Начни общение</p>
            </div>
        </div>

    </div>
</div>

<div class="bottom">

    <div class="nav-button active" onclick="showSection('Сообщения',this)">
        <span>💬</span>
        Чаты
    </div>

    <div class="nav-button" onclick="showSection('Контакты',this)">
        <span>👥</span>
        Контакты
    </div>

    <div class="nav-button" onclick="showSection('Профиль',this)">
        <span>👤</span>
        Профиль
    </div>

</div>

<script>
function searchChats() {
    const input = document
        .getElementById("search")
        .value.toLowerCase();

    document.querySelectorAll(".chat").forEach(chat => {
        const name = chat
            .querySelector("h3")
            .textContent.toLowerCase();

        chat.style.display =
            name.includes(input) ? "flex" : "none";
    });
}

function openChat(name) {
    alert(
        "Чат с " + name +
        "\n\nНастоящие сообщения подключим следующим этапом!"
    );
}

function showSection(name, element) {
    document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.remove("active");
    });

    element.classList.add("active");

    alert("Раздел: " + name);
}
</script>

</body>
</html>
