<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Zuno</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Главная */

.container {
    padding: 20px 18px 110px;
}

/* Истории */

.stories {
    display: flex;
    gap: 17px;
    overflow-x: auto;
    padding: 5px 0 22px;
    scrollbar-width: none;
}

.stories::-webkit-scrollbar {
    display: none;
}

.story {
    flex-shrink: 0;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.story:active {
    transform: scale(0.92);
}

.story-circle {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    padding: 3px;

    border: 1px solid rgba(255,255,255,0.3);

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);

    display: flex;
    align-items: center;
    justify-content: center;
}

.story-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;

    background: rgba(255,255,255,0.1);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
}

.story-name {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    margin-top: 8px;
}

/* Заголовок */

.title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title h1 {
    font-size: 27px;
    font-weight: 700;
}

.new-chat {
    width: 43px;
    height: 43px;
    border-radius: 50%;

    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);

    color: white;
    font-size: 25px;
    cursor: pointer;

    backdrop-filter: blur(20px);
    transition: 0.3s;
}

.new-chat:active {
    transform: scale(0.9);
}

/* Поиск */

.search {
    width: 100%;
    padding: 16px 18px;
    margin-bottom: 20px;

    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.1);

    border-radius: 18px;

    color: white;
    font-size: 15px;
    outline: none;

    backdrop-filter: blur(25px);
}

.search::placeholder {
    color: rgba(255,255,255,0.4);
}

/* Чаты */

.chat {
    display: flex;
    align-items: center;

    padding: 15px;
    margin-bottom: 12px;

    border-radius: 22px;

    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    cursor: pointer;
    position: relative;
    overflow: hidden;

    animation: appear 0.6s ease both;

    transition:
        transform 0.25s,
        background 0.25s,
        border-color 0.25s;
}

.chat::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 1px;
    background: rgba(255,255,255,0.2);
}

.chat:active {
    transform: translateY(-4px) scale(0.98);
    background: rgba(255,255,255,0.09);
}

.avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;

    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
    font-weight: bold;

    margin-right: 14px;
    flex-shrink: 0;
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-info h3 {
    font-size: 16px;
    margin-bottom: 7px;
}

.chat-info p {
    font-size: 13px;
    color: rgba(255,255,255,0.45);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.time {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    align-self: flex-start;
}

/* Нижняя панель */

.bottom {
    position: fixed;
    bottom: 15px;
    left: 15px;
    right: 15px;

    display: flex;
    justify-content: space-around;
    align-items: center;

    padding: 15px 5px;

    border-radius: 25px;

    background: rgba(20,20,20,0.75);
    border: 1px solid rgba(255,255,255,0.12);

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.nav-button {
    color: rgba(255,255,255,0.45);
    text-align: center;
    font-size: 12px;
    cursor: pointer;

    transition: 0.3s;
}

.nav-button span {
    display: block;
    font-size: 22px;
    margin-bottom: 5px;
}

.nav-button.active {
    color: white;
    transform: translateY(-3px);
}

/* Анимация появления */

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (prefers-reduced-motion: reduce) {
    * {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ИСТОРИИ -->

    <div class="stories">

        <div class="story" onclick="openStory('Моя история')">
            <div class="story-circle">
                <div class="story-avatar">+</div>
            </div>
            <div class="story-name">Моя история</div>
        </div>

        <div class="story" onclick="openStory('Александр')">
            <div class="story-circle">
                <div class="story-avatar">А</div>
            </div>
            <div class="story-name">Александр</div>
        </div>

        <div class="story" onclick="openStory('Мария')">
            <div class="story-circle">
                <div class="story-avatar">М</div>
            </div>
            <div class="story-name">Мария</div>
        </div>

        <div class="story" onclick="openStory('Илья')">
            <div class="story-circle">
                <div class="story-avatar">И</div>
            </div>
            <div class="story-name">Илья</div>
        </div>

        <div class="story" onclick="openStory('Друзья')">
            <div class="story-circle">
                <div class="story-avatar">👥</div>
            </div>
            <div class="story-name">Друзья</div>
        </div>

    </div>

    <!-- ЗАГОЛОВОК -->

    <div class="title">
        <h1>Чаты</h1>

        <button class="new-chat" onclick="newChat()">+</button>
    </div>

    <!-- ПОИСК -->

    <input
        class="search"
        id="search"
        placeholder="⌕  Поиск чатов..."
        oninput="searchChats()"
    >

    <!-- СПИСОК ЧАТОВ -->

    <div id="chats">

        <div class="chat" onclick="openChat('Александр')">
            <div class="avatar">А</div>

            <div class="chat-info">
                <h3>Александр</h3>
                <p>Привет! Как дела?</p>
            </div>

            <div class="time">12:30</div>
        </div>

        <div class="chat" onclick="openChat('Мария')">
            <div class="avatar">М</div>

            <div class="chat-info">
                <h3>Мария</h3>
                <p>Отправила тебе фотографию</p>
            </div>

            <div class="time">11:45</div>
        </div>

        <div class="chat" onclick="openChat('Илья')">
            <div class="avatar">И</div>

            <div class="chat-info">
                <h3>Илья</h3>
                <p>Го сегодня гулять?</p>
            </div>

            <div class="time">Вчера</div>
        </div>

        <div class="chat" onclick="openChat('Друзья')">
            <div class="avatar">👥</div>

            <div class="chat-info">
                <h3>Друзья</h3>
                <p>Новые сообщения</p>
            </div>

            <div class="time">Вчера</div>
        </div>

    </div>

</div>

<!-- НИЖНЯЯ ПАНЕЛЬ -->

<div class="bottom">

    <div class="nav-button active" onclick="showSection('Чаты',this)">
        <span>💬</span>
        Чаты
    </div>

    <div class="nav-button" onclick="showSection('Звонки',this)">
        <span>📞</span>
        Звонки
    </div>

    <div class="nav-button" onclick="showSection('Настройки',this)">
        <span>⚙️</span>
        Настройки
    </div>

</div>

<script>

function searchChats() {
    const input = document
        .getElementById("search")
        .value.toLowerCase();

    document.querySelectorAll(".chat").forEach(chat => {
        const name = chat
            .querySelector("h3")
            .textContent.toLowerCase();

        chat.style.display =
            name.includes(input) ? "flex" : "none";
    });
}

function openChat(name) {
    alert(
        "Чат с " + name +
        "\n\nНастоящие сообщения подключим следующим этапом!"
    );
}

function openStory(name) {
    alert(
        name +
        "\n\nИстории подключим следующим этапом!"
    );
}

function newChat() {
    alert("Создание нового чата скоро появится!");
}

function showSection(name, element) {
    document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.remove("active");
    });

    element.classList.add("active");

    alert("Раздел: " + name);
}

</script>

</body>
</html>
